version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017/agriflow
      - JWT_SECRET=agriflow_super_secret_jwt_key_2026_sih
      - OTP_MODE=development
      - DEV_OTP=123456
      - MAP_PROVIDER=mock
    depends_on:
      - mongo

  mongo:
    image: mongo:6.0
    container_resources:
      limits:
        memory: 512M
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
